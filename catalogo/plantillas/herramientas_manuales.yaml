      mapa:
        '1': 1 t
        '1.5': 1.5 t
        '2': 2 t
        '2.5': 2.5 t
        '3': 3 t
        '4': 4 t
        '5': 5 t
        '10': 10 t
        '12': 12 t
        '20': 20 t
        ? ''
        : N/D
      crea_variante: true
    tipo:
      regex: \b(BOTELLA|BOTEELA|PATIN|TIJERA)\b
      mapa:
        BOTEELA: BOTELLA
      crea_variante: false
