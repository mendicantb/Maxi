# Motos y motocarros. Plantilla = MARCA + MODELO; el AÑO crea la variante (curva de depreciación).
# PF: MOTOCICLETA y POCHIMOVIL (las evaluadoras mezclan motos con pochimóviles; Italika/Veloci caen en ambas).
categoria: Motos
familias_prendaflex: [MOTOCICLETA, POCHIMOVIL, CAMION]   # CAMION: hay un 'Italika FT180' capturado como camión
excluir: ['\bCASCO\b', '\bLLANTA\b', '\bCAJONERA\b', '\bBOCINA\b']

atributos:
  anio:
    regex: '(?<!\d)((?:19[6-9]|20[0-3])\d)(?!\d)'
    crea_variante: true          # el año mueve el préstamo
  cilindrada:
    regex: '(?<!\d)(110|115|125|150|160|180|200|250|300|400)\s*CC\b'
    formato: '{} cc'
    crea_variante: false
  color:
    regex: '\b(NEGR[OA]|BLANC[OA]|ROJ[OA]|AZUL|GRIS|VERDE|NARANJA|AMARILL[OA]|PLATA|DORAD[OA]|MORAD[OA]|ROSA|CAFE)\b'
    mapa: {NEGRA: NEGRO, BLANCA: BLANCO, ROJA: ROJO, AMARILLA: AMARILLO, DORADA: DORADO, MORADA: MORADO}
    crea_variante: false

x-checklist: &chk_moto
  - Factura original (a nombre del cliente o endosada)
  - Tarjeta de circulación vigente
  - Placas puestas (anotar número)
  - NIV del chasis coincide con factura / tarjeta
  - REPUVE sin reporte de robo
  - Sin adeudo de tenencia ni multas
  - Arranca y funciona
  - Llaves (cuántas)
  - Luces, direccionales y claxon
  - Llantas y frenos
  - Sin golpes ni tanque abollado
  - Tablero / kilometraje
x-fotos: &fotos_moto [Lado izquierdo, Lado derecho, Frente, Trasera, Tablero (kilometraje), NIV (chasis), Número de motor, Placa, Tarjeta de circulación, Factura]
x-molde: &molde_moto 'Motocicleta {marca} {nombre} {anio} {color} · placas {placas} · NIV {niv} · km {km} · llaves {llaves}'

