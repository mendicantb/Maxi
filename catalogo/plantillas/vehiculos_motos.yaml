  # ---------------------------------------------------------------- motocarros / pochimóviles
  - id: moto.piaggio.ape
    solo_familia: true
    nombre: Ape (motocarro / pochimóvil)
    marca: Piaggio
    match: ['\bPIAGGIO', '\bPIAGIO', '\bPIAJJIO', '\bAPE\s*(CITY|XTRA|CARGO|TM)?\b']
    sinonimos: [piaggio, ape, pochimovil, pochi, mototaxi]
    checklist: &chk_moc
      - Factura original
      - Tarjeta de circulación vigente
      - Placas puestas (anotar número)
      - NIV / número de motor coinciden con factura
      - REPUVE sin reporte
      - Concesión / permiso de servicio (si es de pasaje)
      - Arranca y funciona
      - Llaves (cuántas)
      - Cabina / caja o asientos en buen estado
      - Llantas, frenos y luces
    fotos: &fotos_moc [Lado izquierdo, Lado derecho, Frente, Trasera, Interior cabina / asientos, Tablero (kilometraje), NIV, Número de motor, Placa, Tarjeta de circulación]
    molde_descripcion: &molde_moc 'Motocarro {marca} {nombre} {anio} {color} · placas {placas} · NIV {niv} · llaves {llaves}'
  - id: moto.tvs.motocarro
