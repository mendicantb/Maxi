# Plantillas de TABLETS (PRENDA FLEX: TABLETS). Ver docs/notas_celulares.md
# Específicas por marca/modelo primero; genéricas al final. iPad no apareció en los datos (agregar cuando llegue).
categoria: Tablets
familias_prendaflex: [TABLETS]

defaults:
  chk_tablet: &chk_tablet [Enciende, Pantalla sin estrellar ni manchas, Táctil responde, Cuenta Google / Samsung cerrada (sin FRP), Sin bloqueo de patrón o PIN, Con cargador, Con funda o accesorios (anotar)]
  fotos_tablet: &fotos_tablet [Frente encendido, Reverso, Ajustes > Acerca de la tablet (modelo / serie), Cargador y accesorios]
  molde_tablet: &molde_tablet '{marca} {nombre} {capacidad} {color}'

atributos:
  capacidad:
    regex: '\b(16|32|64|128|256|512)\s*GB\b(?!\s*(DE\s*)?RAM)'
    formato: '{}GB'
    crea_variante: true
  ram:
    regex: '\b(2|3|4|6|8|12)\s*(?:GB)?\s*(?:DE\s*)?RAM\b'
    formato: '{}GB RAM'
    crea_variante: false
  color:
    regex: '\b(NEGRO|NEGRA|BLANCO|BLANCA|AZUL|ROJO|ROJA|GRIS|VERDE|MORADO|MORADA|ROSA|DORADO|DORADA|PLATA|AZUL MARINO)\b'
    mapa: {NEGRA: NEGRO, BLANCA: BLANCO, ROJA: ROJO, MORADA: MORADO, DORADA: DORADO}
    crea_variante: false

plantillas:
  - id: tab.samsung.tab-s10-fe
    nombre: 'Galaxy Tab S10 FE'
    marca: Samsung
    match:
      - '(?<![A-Z0-9])SM\s?-?X6[12]\d'
      - '^(?=.*(?:\bS[AM][MNSU]{1,3}[SUNG]{1,5}|GALAX|\bSM\s?-?[A-Z]?\d)).*(?:TAB\s?S\s?10)'
    sinonimos: [galaxy tab s10 fe, tab s10 fe]
    checklist: *chk_tablet
    fotos: *fotos_tablet
    molde_descripcion: *molde_tablet
  - id: tab.samsung.tab-a9-plus
    nombre: 'Galaxy Tab A9+'
    marca: Samsung
    match:
      - '(?<![A-Z0-9])SM\s?-?X21\d'
      - '^(?=.*(?:\bS[AM][MNSU]{1,3}[SUNG]{1,5}|GALAX|\bSM\s?-?[A-Z]?\d)).*(?:A\s?9\s?(?:PLUS|\+))'
    sinonimos: [galaxy tab a9+, tab a9+, a9 plus]
    checklist: *chk_tablet
    fotos: *fotos_tablet
    molde_descripcion: *molde_tablet
  - id: tab.samsung.tab-a9
    nombre: 'Galaxy Tab A9'
    marca: Samsung
    match:
      - '(?<![A-Z0-9])SM\s?-?X11\d'
      - '^(?=.*(?:\bS[AM][MNSU]{1,3}[SUNG]{1,5}|GALAX|\bSM\s?-?[A-Z]?\d)).*(?:TAB\s?A\s?9|\bTABLET A9\b|MODELO A9$)'
    sinonimos: [galaxy tab a9, tab a9, a9]
    checklist: *chk_tablet
    fotos: *fotos_tablet
    molde_descripcion: *molde_tablet
  - id: tab.samsung.tab-a-8-2019
    nombre: 'Galaxy Tab A 8.0 (2019)'
    marca: Samsung
    match:
      - '(?<![A-Z0-9])SM\s?-?T29\d'
    sinonimos: [galaxy tab a 8.0 (2019), tab a 8.0, t290]
    checklist: *chk_tablet
