# Relojes: marca/línea donde hay volumen; "original vs réplica" no se infiere (ver atributo autenticidad, sólo si la evaluadora lo escribió).
categoria: Relojes
familias_prendaflex:
- RELOJES
excluir: []
atributos:
  color:
    regex: \b(NEGRO|NEGRA|PLATA|PLATEADO|DORADO|DORADA|AZUL|ROSA|ROJO|CAFE|GRIS|VERDE|AMARILLO|MORADA|MORADO|BLANCO)\b
    mapa:
      NEGRA: NEGRO
      PLATEADO: PLATA
      DORADA: DORADO
      MORADA: MORADO
    crea_variante: false
  material:
    regex: \b(ACERO INOX\w*|ACERO|PIEL|PLASTICO|SILICON\w*|CERAMICA|ORO)\b
    crea_variante: false
  autenticidad:
    regex: \b(REPLICA|CLON|GENERICO|ORIGINAL|PIRATA)\b
    crea_variante: false
  estado:
    regex: \b(NUEVO|EN CAJA|CON CAJA|MARCAS? DE USO|RAYAD[OA]|DETALLES?|DA[NÑ]AD[OA]|FUNCIO\w+|MARCAS EN LA MICA)\b
    crea_variante: false
  accesorios:
    regex: \b(CARGADOR|CARAGDOR|CABLE DE CARGA|CAJA|CAJITA)\b
    crea_variante: false
plantillas:
- id: rel.rolex
  nombre: Rolex
  marca: Rolex
  match:
  - \bROL[EA]?X\b
  - \bROLEZ\b
  - OYSTERPERPETUAL|OYSTERPERPEETUAL
  - \bSUBMARINER\b
  sinonimos:
  - rolex
  - rolex oyster
  - rolex submariner
  - rolex replica
  checklist:
  - Enciende / funciona
  - Revisión de autenticidad (peso, mecanismo, número de serie)
  - Cristal sin rayones
  - Pulso completo
  - Caja y papeles
  fotos:
  - Carátula
  - Caja trasera (modelo/serie)
  - Correa y broche
  molde_descripcion: '{marca} {nombre} {color} {condicion}'
