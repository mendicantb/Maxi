  - orilladora
  - guadañadora
  - guadaña
  - decbrozadora
  atributos:
    gama: *id001
    cc:
      regex: \b(\d{2,3})\s?CC\b
      crea_variante: false
  checklist: &id003
  - Enciende y arranca
  - Acelera y no se apaga
  - Sin fugas de combustible
  - Filtro de aire y bujía en buen estado
  - Incluye accesorios (arnés, cuchilla/barra, funda)
