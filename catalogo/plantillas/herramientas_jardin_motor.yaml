- id: herr.desbrozadora.electrica
  nombre: Desbrozadora eléctrica / inalámbrica
  match:
  - \bFSE\s?\d{2}
  - ^(?=.*(?:\bD[EA]?[SZ][BP][RO]{0,2}Z?A?D?[OP]{0,2}RA\b|\bDESBROZ))(?=.*(?:ELECTRIC|INALAM|CARGADOR|BATERIA|\bPILAS?\b|\b\d{2}\s?V\b|MINI))
  sinonimos:
  - desbrozadora electrica
  - desbrozadora inalambrica
  - orilladora
  - cortadora de pasto electrica
  atributos:
    gama: *id001
  checklist:
  - Enciende y funciona
  - Con batería y cargador (si es inalámbrica)
  - Cable sin empalmes (si es eléctrica)
  - Cabezal/hilo o cuchilla
  - Incluye arnés/protector
  fotos:
  - Frente completo
  - Placa de datos/modelo
  - Batería y cargador
  - Maletín/accesorios
  - Marcas de uso/golpes
  molde_descripcion: '{nombre} {marca_detectada}'
