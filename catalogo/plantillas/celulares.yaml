# Plantillas de CELULARES (PRENDA FLEX: CELULARES). Generado/curado en conjunto con docs/notas_celulares.md
# Orden: específicas por marca (modelo más largo antes que el corto) -> genéricas por marca -> genérica final.
# Los "guards" ^(?=.*MARCA) evitan que A54 de Samsung le gane a A54 de Oppo/ZTE, etc.
categoria: Celulares
familias_prendaflex: [CELULARES]
# Tablets/iPad capturados como celular se dejan caer a tablets.yaml (segunda pasada, otra_familia)
excluir:
  - '\bTABLE?T'
  - '\bTABLES\b'
  - '\bIPAD\b'
  - 'MAT\s?PADD?'
  - 'GALAXY\s?TAB'

# Valores por omisión reutilizados con anclas YAML (checklist / fotos / molde por tipo de equipo)
defaults:
  chk_android: &chk_android [Enciende, Pantalla sin estrellar ni manchas, Táctil responde, Cuenta Google cerrada (sin FRP), Sin bloqueo de patrón o PIN, Bandeja de SIM presente, Con cargador]
  fotos_android: &fotos_android [Frente encendido, Reverso, IMEI (marcar *#06#), Cargador y accesorios]
  molde_android: &molde_android '{marca} {nombre} {capacidad} {color}'
  chk_iphone: &chk_iphone [Enciende, Pantalla sin estrellar ni manchas, Táctil y Face ID / Touch ID funcionan, Cuenta iCloud cerrada (Buscar mi iPhone apagado), Salud de batería anotada, Con cargador]
  fotos_iphone: &fotos_iphone [Frente encendido, Reverso, Ajustes > General > Acerca de (modelo / IMEI), Salud de batería]
  molde_iphone: &molde_iphone '{marca} {nombre} {capacidad} {color}'

atributos:
  capacidad:
    regex: '\b(16|32|64|128|256|512)\s*GB\b(?!\s*(DE\s*)?RAM)'
    formato: '{}GB'
    crea_variante: true
  ram:
    regex: '\b(2|3|4|6|8|12)\s*(?:GB)?\s*(?:DE\s*)?RAM\b'
    formato: '{}GB RAM'
    crea_variante: false
  color:
    regex: '\b(NEGRO|NEGRA|BLANCO|BLANCA|AZUL|ROJO|ROJA|GRIS|VERDE|MORADO|MORADA|ROSA|DORADO|DORADA|PLATA|PLATEADO|AMARILLO|NARANJA|LILA|CELESTE|TITANIO)\b'
    mapa: {NEGRA: NEGRO, BLANCA: BLANCO, ROJA: ROJO, MORADA: MORADO, DORADA: DORADO, PLATEADO: PLATA}
    crea_variante: false

