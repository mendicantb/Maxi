      - '^(?=.*(?:\bS[AM][MNSU]{1,3}[SUNG]{1,5}|GALAX|\bSM\s?-?[A-Z]?\d)).*(?<![A-Z0-9])A(?:015|013)[A-Z]?(?![A-Z0-9])'
    sinonimos: [galaxy a01 / a01 core, samsung a01 / a01 core, a01 / a01 core]
